<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Portfólio</title>
    <style>
        body { margin:0; font-family: Arial, sans-serif; background:#111; color:#eee; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
        h1 { margin-bottom: 20px; }
        .dev-mode { margin-top:30px; }
        .dev-mode button { padding:10px 20px; font-size:1rem; background:#0066cc; color:#fff; border:none; border-radius:4px; cursor:pointer; }
        .dev-mode button:hover { background:#0052a3; }
    </style>
</head>
<body>
    <div>
        <h1>Seu Portfólio</h1>
        <p>Bem-vindo ao meu portfólio pessoal. Aqui você pode ver meus projetos, habilidades e contato.</p>
        <!--coloque seu conteúdo aqui-->
    </div>
    <div class="dev-mode">
        <button id="devBtn">Modo Dev Front</button>
    </div>
    <script>
        document.getElementById('devBtn').onclick = function() {
            // Chamar o HTA para abrir o Windows
            var shell = new ActiveXObject("WScript.Shell");
            shell.Run("explorer.exe");
            window.close();
        };
    </script>
</body>
</html>
